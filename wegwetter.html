<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wegwetter</title>
<style>
:root{--bg:#14684f;--fg:#f4f7f5;--panel:#f4f6f5;--ink:#1b2420;--mut:#5d6b64;--line:#d5dcd8;
--s0:#5d6b64;--s1:#b7791f;--s2:#c4561c;--s3:#a3262a;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--panel:#1a201d;--ink:#e8eeea;--mut:#9aa8a0;--line:#2d3732}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;background:var(--panel);color:var(--ink);
padding-bottom:env(safe-area-inset-bottom,0)}
body[data-v=bike]{--bg:#14684f}body[data-v=care]{--bg:#a8700f}body[data-v=car]{--bg:#33456b}
.hero{background:var(--bg);color:var(--fg);padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 28px;transition:background .4s}
.bar{display:flex;justify-content:space-between;align-items:center;max-width:560px;margin:0 auto 12px;font-size:15px;opacity:.9}
.bar button{background:none;border:1px solid currentColor;color:inherit;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
#sym{display:block;margin:0 auto;max-width:560px;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:center;cursor:pointer;padding:8px 0}
#sym svg{width:min(62vw,300px);height:auto}
#sym .t{font-size:clamp(34px,9vw,52px);font-weight:700;letter-spacing:-.02em;margin-top:6px}
#sym .s{font-size:17px;opacity:.92;margin-top:6px;line-height:1.35}
#sym .h{font-size:14px;opacity:.75;margin-top:14px}
main{max-width:560px;margin:0 auto;padding:18px 20px 40px}
.leg{margin:0 0 26px}
.leg h3{margin:0 0 10px;font-size:18px}
.f{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.f i{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--s0)}
.f.s1 i{background:var(--s1)}.f.s2 i{background:var(--s2)}.f.s3 i{background:var(--s3)}
.f b{display:block;font-size:16px}.f span{color:var(--mut);font-size:15px;line-height:1.4}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
th,td{text-align:left;padding:6px 4px;border-top:1px solid var(--line)}th{color:var(--mut);font-weight:500}
.note{color:var(--mut);font-size:13px;line-height:1.45;margin-top:18px}
.err{background:#fdecea;color:#7a1c14;padding:12px 14px;border-radius:8px;margin:0 0 16px;font-size:15px}
form{display:grid;gap:14px}
label{display:grid;gap:5px;font-size:14px;color:var(--mut)}
input[type=text],input[type=time]{font:inherit;font-size:17px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chk{display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-size:15px}
.go{font:inherit;font-weight:600;font-size:17px;padding:13px;border:0;border-radius:8px;background:var(--bg);color:#fff;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #f0b429;outline-offset:2px}
.via{display:grid;grid-template-columns:1fr auto;gap:8px}
.sm{font:inherit;font-size:14px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
[hidden]{display:none!important}

:root{--card:#fff}
@media(prefers-color-scheme:dark){:root{--card:#1c2420}}
body{background:#eaf0ec}
@media(prefers-color-scheme:dark){body{background:#0f1512}}
.hero{border-radius:0 0 34px 34px;background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--bg) 72%,#fff),var(--bg) 62%);box-shadow:0 14px 34px #0003}
#sym svg{width:min(56vw,250px);padding:9%;border-radius:50%;background:#ffffff1f;box-shadow:inset 0 0 0 2px #ffffff40,0 12px 30px #0003}
#sym .t{text-shadow:0 2px 10px #0003}
.leg{background:var(--card);border-radius:22px;padding:16px 18px 8px;margin:0 0 16px;box-shadow:0 2px 12px #0001}
.leg h3{font-size:19px}
.f:first-of-type{border-top:0}
.pc{float:right;font-weight:600;font-size:14px;color:var(--mut)}
.bar2{height:7px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
.fl{height:100%;background:var(--s1)}.s2 .fl{background:var(--s2)}.s3 .fl{background:var(--s3)}
.modes{display:flex;gap:8px}
.modes button{flex:1;font:inherit;font-weight:600;padding:11px 6px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.modes button.on{background:var(--bg);border-color:var(--bg);color:#fff}
#map{height:min(54vh,430px);border-radius:20px;overflow:hidden;box-shadow:0 4px 16px #0003;z-index:0}
#plist{list-style:none;padding:0;margin:0;display:grid;gap:8px}
#plist li{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:8px 10px;font-size:14px}
#plist li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pin{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 14px system-ui,sans-serif;color:#fff;border:3px solid #fff;box-shadow:0 2px 8px #0006;background:#14684f}
.pin.v{background:#3a6ea5}.pin.z{background:#a3262a}
.go{border-radius:14px}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
</head>
<body data-v="bike">
<div class="hero">
  <div class="bar"><span id="when">Wegwetter</span><button id="gear" type="button">Einstellungen</button></div>
  <button id="sym" type="button" aria-expanded="false" aria-controls="det">
    <span id="ico"></span>
    <div class="t" id="tt">Lade …</div>
    <div class="s" id="ss">Wetter entlang deiner Route wird abgerufen.</div>
    <div class="h" id="hh" hidden>Tippen für die Gründe</div>
  </button>
</div>
<main>
  <div id="err" class="err" hidden></div>
  <section id="det" hidden></section>
  <section id="set" hidden>
    <form id="frm">
      <datalist id="dl"></datalist>
      <div class="modes" role="group" aria-label="Was setzt du beim Tippen auf die Karte?"><button type="button" data-m="a">Start</button><button type="button" data-m="v">+ Zwischenpunkt</button><button type="button" data-m="b">Ziel</button></div>
      <input type="text" id="srch" list="dl" data-addr autocomplete="off" placeholder="Ort suchen und Enter drücken" aria-label="Ort suchen">
      <div id="map" role="application" aria-label="Karte: tippe, um Punkte zu setzen"></div>
      <div style="display:flex;gap:10px;align-items:center"><button class="sm" type="button" id="loc">Mein Standort</button><span class="note" id="kmv" style="margin:0"></span></div>
      <ul id="plist"></ul>
      <div class="row">
        <label>Anzeige um<input type="time" id="tShow" value="06:30" required></label>
        <label>Hinfahrt<input type="time" id="tHin" value="07:30" required></label>
        <label>Rückfahrt<input type="time" id="tRue" value="16:30" required></label>
      </div>
      <label class="chk"><input type="checkbox" id="nf"> Zur Anzeigezeit benachrichtigen (nur solange diese Seite geöffnet ist)</label>
      <button class="go" type="submit" id="save">Route speichern</button>
    </form>
  </section>
  <p class="note" id="src" hidden>Daten: Open-Meteo (Wetter, Bodentemperatur), OpenStreetMap/OSRM (Route), Deutscher Wetterdienst via Brightsky (Warnungen). Prognosen sind keine Garantie – Glätte kann lokal früher auftreten als vorhergesagt.</p>
</main>
<script>
const $=s=>document.querySelector(s), pad=n=>String(n).padStart(2,'0'), KEY='wegwetter.v1';
const BIKE='<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="14" cy="43" r="10"/><circle cx="50" cy="43" r="10"/><path d="M14 43H30L26 24H42L50 43M26 24 14 43M42 24 30 43M42 24l-2-7h6M22 21h8"/></svg>';
const CAR='<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 38l4-12c1-3 3-5 6-5h28c3 0 5 2 6 5l4 12v10h-6v-4H14v4H8z"/><path d="M13 27h38"/><circle cx="18" cy="37" r="2.4"/><circle cx="46" cy="37" r="2.4"/></svg>';
let S=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const mins=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const nn=(a,i)=>a&&a[i]!=null?a[i]:null;
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const showErr=m=>{const e=$('#err');e.hidden=!m;e.textContent=m||''};
const j=async u=>{let r;const h=new URL(u).hostname;
  try{r=await fetch(u)}catch(e){throw new Error('Verbindung blockiert ('+h+')')}
  if(!r.ok)throw new Error('Fehler '+r.status+' ('+h+')');return r.json()};
const hint=m=>m.startsWith('Verbindung blockiert')?m+'. Wird die Datei innerhalb der Claude-App angezeigt, sind Internetzugriffe gesperrt: Lade sie herunter und öffne sie direkt in Safari oder Chrome.':m;

const sug={};let sugT;
function fmt(p){
  const a=[],st=p.street?p.street+(p.housenumber?' '+p.housenumber:''):'';
  if(p.name&&p.name!==p.street)a.push(p.name);
  if(st)a.push(st);
  const c=[p.postcode,p.city||p.town||p.village||p.county].filter(Boolean).join(' ');
  if(c)a.push(c);
  return[...new Set(a)].join(', ');
}
const photon=(q,n)=>j('https://photon.komoot.io/api/?lang=de&limit='+n+'&q='+encodeURIComponent(q)+(S.a?`&lat=${S.a.lat}&lon=${S.a.lon}`:''));
async function suggest(inp){
  const q=inp.value.trim();if(q.length<3)return;
  try{const r=await photon(q,6),dl=$('#dl');dl.textContent='';
    r.features.forEach(f=>{const l=fmt(f.properties);if(!l)return;
      sug[l]={lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0],label:l};
      const o=el('option');o.value=l;dl.append(o)});
  }catch(e){}
}
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.addr!==undefined){clearTimeout(sugT);sugT=setTimeout(()=>suggest(e.target),350)}});
async function geocode(q){
  q=q.trim();
  if(sug[q])return sug[q];
  const m=q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,;]\s*(-?\d+(?:\.\d+)?)\s*$/);
  if(m)return{lat:+m[1],lon:+m[2],label:q};
  const nq=q.replace(/str\./gi,'straße').replace(/(\S)str(?=\s*\d)/gi,'$1straße');
  try{const f=(await photon(nq,1)).features[0];
    if(f)return{lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0],label:fmt(f.properties)||q}}catch(e){if(/blockiert/.test(e.message))throw e}
  const r=await j('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=de&q='+encodeURIComponent(nq));
  if(!r.length)throw new Error('Adresse nicht gefunden: '+q+'. Wähle einen Vorschlag aus der Liste oder ergänze Ort und Hausnummer.');
  return{lat:+r[0].lat,lon:+r[0].lon,label:q};
}
const hav=(a,b)=>{const R=6371,t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dn=t(b.lon-a.lon);
  const h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
async function getRoute(L){
  try{
    const r=await j(`https://router.project-osrm.org/route/v1/driving/${L.map(p=>p.lon+','+p.lat).join(';')}?overview=full&geometries=geojson`);
    const rt=r.routes[0];return{pts:rt.geometry.coordinates.map(c=>({lat:c[1],lon:c[0]})),km:rt.distance/1000,exact:true};
  }catch(e){let km=0;for(let i=1;i<L.length;i++)km+=hav(L[i-1],L[i]);return{pts:L,km:km*1.25,exact:false}}
}
function samples(pts,n){
  const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+hav(pts[i-1],pts[i]));
  const tot=cum[cum.length-1]||1,out=[];
  for(let k=0;k<n;k++){const want=tot*k/(n-1);let bi=0;
    for(let i=0;i<pts.length;i++)if(Math.abs(cum[i]-want)<Math.abs(cum[bi]-want))bi=i;out.push(pts[bi])}
  return out;
}
async function getWeather(P){
  const hv='temperature_2m,apparent_temperature,dew_point_2m,precipitation_probability,precipitation,snowfall,weather_code,wind_gusts_10m,visibility,soil_temperature_0cm';
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${P.map(p=>p.lat.toFixed(3)).join(',')}&longitude=${P.map(p=>p.lon.toFixed(3)).join(',')}&hourly=${hv}&daily=sunrise,sunset&past_days=1&forecast_days=2&timezone=auto&wind_speed_unit=kmh`;
  const r=await j(u);return Array.isArray(r)?r:[r];
}
async function getAlerts(p){
  try{const r=await j(`https://api.brightsky.dev/alerts?lat=${p.lat.toFixed(3)}&lon=${p.lon.toFixed(3)}`);
    return(r.alerts||[]).filter(a=>['moderate','severe','extreme'].includes(a.severity))}catch(e){return[]}
}

function evalLeg(W,time,bikeMin,alerts){
  const F=[],add=(s,t,d)=>F.push({s,t,d});
  const m0=mins(time),h0=Math.floor(m0/60),span=Math.min(3,Math.floor((m0+bikeMin)/60)-h0);
  const key=`${todayStr()}T${pad(h0)}:00`,i0=W[0].hourly.time.indexOf(key);
  if(i0<0)throw new Error('Keine Prognose für '+time+' Uhr verfügbar.');
  const M={tmin:99,tmax:-99,app:99,pp:0,pr:0,sn:0,g:0,vis:1e9,soil:99,gap:99,pre:0,codes:new Set()};
  const rows=[];
  W.forEach((w,k)=>{const h=w.hourly;let r={t:99,pp:0,g:0};
    for(let i=i0;i<=i0+span;i++){
      const t=nn(h.temperature_2m,i),a=nn(h.apparent_temperature,i),d=nn(h.dew_point_2m,i);
      if(t!=null){M.tmin=Math.min(M.tmin,t);M.tmax=Math.max(M.tmax,t);r.t=Math.min(r.t,t);if(d!=null)M.gap=Math.min(M.gap,t-d)}
      if(a!=null)M.app=Math.min(M.app,a);
      M.pp=Math.max(M.pp,nn(h.precipitation_probability,i)||0);r.pp=Math.max(r.pp,nn(h.precipitation_probability,i)||0);
      M.pr=Math.max(M.pr,nn(h.precipitation,i)||0);M.sn=Math.max(M.sn,nn(h.snowfall,i)||0);
      const g=nn(h.wind_gusts_10m,i)||0;M.g=Math.max(M.g,g);r.g=Math.max(r.g,g);
      const v=nn(h.visibility,i);if(v!=null)M.vis=Math.min(M.vis,v);
      const s=nn(h.soil_temperature_0cm,i);if(s!=null)M.soil=Math.min(M.soil,s);
      const c=nn(h.weather_code,i);if(c!=null)M.codes.add(c);
    }
    for(let i=Math.max(0,i0-6);i<i0;i++)M.pre+=nn(h.precipitation,i)||0;
    rows.push(r);
  });
  const has=(...c)=>c.some(x=>M.codes.has(x)),r1=x=>Math.round(x);
  if(has(56,57,66,67))add(3,'Gefrierender Regen','Regen fällt auf gefrorenen Boden und bildet sofort eine Eisschicht. Auf dem Rad extrem gefährlich.');
  if(has(95,96,99))add(3,'Gewitter','Blitzschlag, Sturmböen und plötzlicher Starkregen entlang der Strecke.');
  const wet=M.pr>0||M.pre>0.1;
  if(M.tmin<=0.5&&wet&&!has(56,57,66,67))add(3,'Glatteisgefahr',`Frost (${r1(M.tmin)} °C) bei Nässe: Pfützen und nasse Flächen können überfrieren, vor allem auf Brücken und im Schatten.`);
  else if(M.tmin<=3&&(M.soil<=0||(M.tmin<=2&&M.gap<1.5)))add(2,'Reifglätte möglich',`Bodentemperatur ${M.soil<90?r1(M.soil)+' °C':'um den Gefrierpunkt'} bei hoher Luftfeuchte: Brücken, Radwege und Schattenstücke können spiegelglatt sein.`);
  if(M.sn>1||has(75,86))add(3,'Starker Schneefall','Schnee- und Eisdecke, schlechte Sicht, Radwege oft nicht geräumt.');
  else if(M.sn>0.1||has(71,73,77,85))add(2,'Schnee','Leichter Schneefall: rutschig, besonders auf Radwegen und Markierungen.');
  if(M.pp>=70)add(2,'Regen sehr wahrscheinlich',`Bis zu ${r1(M.pp)} % Regenwahrscheinlichkeit${M.pr>=2.5?', teils Starkregen ('+M.pr.toFixed(1)+' mm/h)':''}.`);
  else if(M.pp>=40)add(1,'Regen möglich',`Bis zu ${r1(M.pp)} % Regenwahrscheinlichkeit auf der Strecke.`);
  else if(!wet)add(0,'Trocken',`Regenwahrscheinlichkeit höchstens ${r1(M.pp)} %.`);
  if(wet&&M.tmin>0.5)add(0,'Nasse Fahrbahn','Längerer Bremsweg. Laub, Fahrbahnmarkierungen, Gullydeckel und Schienen sind rutschig.');
  if(M.app<=-5)add(2,'Sehr kalt',`Gefühlt ${r1(M.app)} °C (Luft ${r1(M.tmin)} °C). Finger und Gesicht kühlen schnell aus.`);
  else if(M.app<=0)add(1,'Frostig',`Gefühlt ${r1(M.app)} °C (Luft ${r1(M.tmin)} °C).`);
  else if(M.app<=6)add(0,'Kühl',`Gefühlt ${r1(M.app)} °C, Handschuhe und winddichte Jacke empfohlen.`);
  if(M.tmax>=32)add(1,'Hitze',`Bis ${r1(M.tmax)} °C: viel trinken, Sonnenschutz.`);
  if(M.g>=65)add(3,'Sturmböen',`Böen bis ${r1(M.g)} km/h: Sturzgefahr, Äste und Gegenstände in der Luft.`);
  else if(M.g>=45)add(2,'Starke Böen',`Böen bis ${r1(M.g)} km/h: gefährlicher Seitenwind, vor allem auf Brücken und freien Flächen.`);
  else if(M.g>=30)add(1,'Böig',`Böen bis ${r1(M.g)} km/h.`);
  if(M.vis<500)add(3,'Dichter Nebel',`Sicht unter ${r1(M.vis)} m: du wirst leicht übersehen.`);
  else if(M.vis<1000)add(2,'Nebel',`Sicht nur ${r1(M.vis)} m.`);
  else if(M.vis<3000)add(1,'Eingeschränkte Sicht',`Sicht etwa ${(M.vis/1000).toFixed(1)} km.`);
  const d=W[0].daily,di=d.time.indexOf(todayStr());
  if(di>=0){const sr=mins(d.sunrise[di].slice(11)),ss=mins(d.sunset[di].slice(11));
    if(m0<sr+10||m0+bikeMin>ss-15)add(0,'Dunkelheit',`Sonnenaufgang ${d.sunrise[di].slice(11)}, Sonnenuntergang ${d.sunset[di].slice(11)}: Licht und Reflektoren prüfen.`)}
  alerts.forEach(a=>add(a.severity==='moderate'?2:3,'DWD-Warnung: '+(a.event_de||'Wetterwarnung'),a.headline_de||'Amtliche Warnung für deine Region.'));
  F.sort((x,y)=>y.s-x.s);
  return{time,F,rows,score:F.reduce((s,f)=>s+f.s,0),max:F.reduce((s,f)=>Math.max(s,f.s),0)};
}

function nightHazards(W){
  const y=new Date(Date.now()-864e5),ys=`${y.getFullYear()}-${pad(y.getMonth()+1)}-${pad(y.getDate())}`;
  const t=W[0].hourly.time,i1=t.indexOf(ys+'T20:00'),i2=t.indexOf(todayStr()+'T06:00');
  if(i1<0||i2<0)return[];
  let g=0,pr=0,sn=0,tmin=99,soil=99,gap=99,fr=false;
  W.forEach(w=>{const h=w.hourly;let p=0,s=0;
    for(let i=i1;i<=i2;i++){g=Math.max(g,nn(h.wind_gusts_10m,i)||0);p+=nn(h.precipitation,i)||0;s+=nn(h.snowfall,i)||0;
      const T=nn(h.temperature_2m,i),d=nn(h.dew_point_2m,i),so=nn(h.soil_temperature_0cm,i),c=nn(h.weather_code,i);
      if(T!=null){tmin=Math.min(tmin,T);if(d!=null)gap=Math.min(gap,T-d)}
      if(so!=null)soil=Math.min(soil,so);if([56,57,66,67].includes(c))fr=true}
    pr=Math.max(pr,p);sn=Math.max(sn,s)});
  const F=[],add=(p,t,d)=>{p=Math.round(Math.min(95,p));if(p>=15)F.push({s:p>=70?3:p>=40?2:1,t,d,p})};
  const lv=g>=105?80:g>=90?60:g>=75?35:g>=60?15:0,mon=new Date().getMonth();
  if(lv)add(lv+(pr>10?10:0),'Äste und umgestürzte Bäume',`Nachtböen bis ${Math.round(g)} km/h: Äste oder Bäume können Rad- und Waldwege blockieren.`);
  if(mon>=8&&mon<=10&&(g>=40||pr>=5))add(50+(g>=40?15:0)+(pr>=5?15:0),'Nasses Laub und Schmutz',`Wind und Regen (${pr.toFixed(0)} mm) haben Laub auf die Wege gebracht: rutschig, vor allem in Kurven.`);
  let ice=0,id='';
  if(fr){ice=90;id='Gefrierender Regen hat in der Nacht eine Eisschicht gebildet.'}
  else if(tmin<=0.5&&pr>0.1){ice=tmin<=-1?75:60;id=`Frost bis ${Math.round(tmin)} °C nach Niederschlag (${pr.toFixed(1)} mm): nasse Stellen sind vermutlich überfroren.`}
  else if(tmin<=3&&(soil<=0||(tmin<=2&&gap<1.5))){ice=40;id='Reif auf Brücken, Radwegen und Schattenstücken wahrscheinlich.'}
  add(ice,'Glatteis und Reifglätte',id);
  if(sn>=0.3)add(sn>=2?80:50,'Schnee oder Matsch auf den Wegen',`Nachts etwa ${sn.toFixed(1)} cm Neuschnee: nicht geräumte Radwege, Matsch.`);
  if(pr>=8)add(pr>=15?55:30,'Pfützen, Überflutung, Schlamm',`${pr.toFixed(0)} mm Regen in der Nacht: überspülte Unterführungen und Schlamm auf Radwegen möglich.`);
  return F.sort((a,b)=>b.p-a.p);
}
function verdict(legs,N){
  const max=Math.max(...legs.map(l=>l.max)),sum=Math.max(...legs.map(l=>l.score));
  const top=[...legs.flatMap(l=>l.F),...N].sort((a,b)=>b.s-a.s)[0];
  const w=top&&top.s>0?top.t+(top.p?` (${top.p} %)`:''):'';
  if(max>=3||sum>=4)return{v:'car',t:'Auto',s:w?w+': zu riskant für das Rad.':'Zu viele Risiken für das Rad.'};
  if(max>=2||sum>=2)return{v:'care',t:'Fahrrad',s:'Mit Vorsicht: '+w+'.'};
  return{v:'bike',t:'Fahrrad',s:w?w+'.':'Gute Bedingungen, keine Gefahren auf der Route.'};
}
function fi(f){
  const r=el('div','f s'+f.s),b=el('div'),h=el('b',null,f.t);b.style.flex='1';
  if(f.p!=null)h.append(el('span','pc',f.p+' % wahrscheinlich'));
  b.append(h,el('span',null,f.d));
  if(f.p!=null){const bar=el('div','bar2'),fl=el('div','fl');fl.style.width=f.p+'%';bar.append(fl);b.append(bar)}
  r.append(el('i'),b);return r;
}
function render(res){
  const V=res.verdict;document.body.dataset.v=V.v;
  $('#ico').innerHTML=V.v==='car'?CAR:BIKE;$('#tt').textContent=V.t;$('#ss').textContent=V.s;$('#hh').hidden=false;
  $('#when').textContent='Heute · '+new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
  const det=$('#det');det.textContent='';
  const intro=el('p','note',`Strecke ca. ${res.km.toFixed(1)} km${res.exact?'':' (Luftlinie, Routing nicht erreichbar)'}, Fahrzeit mit dem Rad ca. ${Math.round(res.bikeMin)} min. Bewertet wurden ${res.n} Punkte entlang der Route.`);
  intro.style.marginTop='0';det.append(intro);
  const ns=el('div','leg');ns.append(el('h3',null,'In der Nacht entstanden (20 bis 6 Uhr)'));
  if(res.N.length)res.N.forEach(f=>ns.append(fi(f)));
  else ns.append(fi({s:0,t:'Keine Hinweise auf Nachtschäden',d:'Weder Sturm noch Frost bei Nässe, Schnee oder Starkregen in der Nacht.'}));
  ns.append(el('p','note','Grobe Schätzung aus Prognosedaten. Echte Schäden auf einzelnen Wegen lassen sich nicht messen.'));det.append(ns);
  res.legs.forEach((l,k)=>{
    const s=el('div','leg');s.append(el('h3',null,(k?'Rückfahrt ':'Hinfahrt ')+l.time+' Uhr'));
    l.F.forEach(f=>s.append(fi(f)));
    const tb=el('table'),hd=el('tr');['Punkt','Temp.','Regen','Böen'].forEach(x=>hd.append(el('th',null,x)));tb.append(hd);
    l.rows.forEach((r,i)=>{const tr=el('tr'),nm=i===0?'Start':i===l.rows.length-1?'Ziel':'Route '+i;
      [nm,Math.round(r.t)+' °C',Math.round(r.pp)+' %',Math.round(r.g)+' km/h'].forEach(x=>tr.append(el('td',null,x)));tb.append(tr)});
    s.append(tb);det.append(s)});
  $('#src').hidden=false;
}
async function refresh(){
  if(!S.a||!S.b){openSettings();return}
  showErr('');$('#tt').textContent='Lade …';$('#ss').textContent='Wetter entlang deiner Route wird abgerufen.';$('#hh').hidden=true;
  try{
    const rt=await getRoute([S.a,...(S.vias||[]),S.b]),n=Math.min(8,Math.max(4,Math.round(rt.km/3)+1)),P=samples(rt.pts,n),bikeMin=Math.max(5,rt.km/17*60);
    const [W,al]=await Promise.all([getWeather(P),getAlerts(P[Math.floor(n/2)])]);
    const legs=[evalLeg(W,S.tHin,bikeMin,al),evalLeg(W,S.tRue,bikeMin,al)];
    const N=nightHazards(W);legs.forEach(l=>{l.score+=N.reduce((a,f)=>a+f.s,0);l.max=Math.max(l.max,...N.map(f=>f.s),0)});const res={legs,N,km:rt.km,exact:rt.exact,bikeMin,n,verdict:verdict(legs,N)};
    S.last={day:todayStr(),v:res.verdict.t};save();render(res);return res;
  }catch(e){showErr('Wetterdaten konnten nicht geladen werden: '+hint(e.message));
    $('#tt').textContent='Keine Daten';$('#ss').textContent='Tippe auf „Einstellungen“ oder lade die Seite neu.'}
}

let map,mk=[],line,D,mode='a',lineId=0;
function setMode(m){mode=m;document.querySelectorAll('.modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m))}
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
const pts=()=>[D.a,...D.vias,D.b].filter(Boolean);
const pinIcon=(t,c)=>L.divIcon({className:'',html:`<div class="pin ${c}">${t}</div>`,iconSize:[34,34],iconAnchor:[17,17]});
async function revLabel(p){
  try{const r=await j(`https://photon.komoot.io/reverse?lang=de&lon=${p.lon}&lat=${p.lat}`),f=r.features[0];
    if(f){p.label=fmt(f.properties);renderList()}}catch(e){}
}
function renderList(){
  const ul=$('#plist');ul.textContent='';
  const row=(p,t,c,rm)=>{const li=el('li'),pin=el('div','pin '+c,t);pin.style.cssText='width:26px;height:26px;font-size:12px;flex:none';
    const x=el('button','sm','×');x.type='button';x.setAttribute('aria-label','Punkt entfernen');x.onclick=rm;
    li.append(pin,el('span',null,p.label||`${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}`),x);ul.append(li)};
  if(D.a)row(D.a,'S','s',()=>{D.a=null;setMode('a');drawMap()});
  D.vias.forEach((p,i)=>row(p,i+1,'v',()=>{D.vias.splice(i,1);drawMap()}));
  if(D.b)row(D.b,'Z','z',()=>{D.b=null;setMode('b');drawMap()});
}
async function drawLine(){
  const P=pts(),id=++lineId;
  if(P.length<2){line.setLatLngs([]);$('#kmv').textContent='';return}
  const rt=await getRoute(P);if(id!==lineId)return;
  line.setLatLngs(rt.pts.map(p=>[p.lat,p.lon]));
  $('#kmv').textContent=`Strecke ca. ${rt.km.toFixed(1)} km${rt.exact?'':' (Luftlinie)'}`;
}
function drawMap(){
  mk.forEach(m=>m.remove());mk=[];
  const add=(p,t,c,set)=>{const m=L.marker([p.lat,p.lon],{icon:pinIcon(t,c),draggable:true}).addTo(map);
    m.on('dragend',()=>{const q=m.getLatLng(),np={lat:q.lat,lon:q.lng};set(np);revLabel(np);drawMap()});mk.push(m)};
  if(D.a)add(D.a,'S','s',q=>D.a=q);
  D.vias.forEach((p,i)=>add(p,i+1,'v',q=>D.vias[i]=q));
  if(D.b)add(D.b,'Z','z',q=>D.b=q);
  renderList();drawLine();
}
function onTap(e){
  const p={lat:e.latlng.lat,lon:e.latlng.lng};
  if(mode==='a'){D.a=p;setMode(D.b?'v':'b')}else if(mode==='b'){D.b=p;setMode('v')}else D.vias.push(p);
  revLabel(p);drawMap();
}
$('#srch').addEventListener('keydown',async e=>{
  if(e.key!=='Enter'||!map)return;e.preventDefault();
  try{const g=await geocode($('#srch').value);map.flyTo([g.lat,g.lon],15)}catch(x){showErr(hint(x.message))}
});
$('#loc').onclick=()=>{if(map&&navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>map.flyTo([p.coords.latitude,p.coords.longitude],15),()=>showErr('Standort nicht verfügbar. Suche stattdessen einen Ort.'))};
function openSettings(){
  $('#set').hidden=false;$('#det').hidden=true;
  D={a:S.a||null,b:S.b||null,vias:[...(S.vias||[])]};
  $('#tShow').value=S.tShow||'06:30';$('#tHin').value=S.tHin||'07:30';$('#tRue').value=S.tRue||'16:30';$('#nf').checked=!!S.nf;
  if(typeof L==='undefined'){showErr('Die Karte konnte nicht geladen werden (leaflet). Prüfe die Internetverbindung und öffne die Datei in einem normalen Browser.');return}
  if(!map){
    map=L.map('map',{zoomControl:false}).setView([51.1,10.4],6);
    L.control.zoom({position:'bottomright'}).addTo(map);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    line=L.polyline([],{color:'#14684f',weight:5,opacity:.85}).addTo(map);
    map.on('click',onTap);
  }
  setMode(D.a?(D.b?'v':'b'):'a');drawMap();
  setTimeout(()=>{map.invalidateSize();const P=pts();
    if(P.length>1)map.fitBounds(L.latLngBounds(P.map(p=>[p.lat,p.lon])),{padding:[30,30]});
    else if(P.length)map.setView([P[0].lat,P[0].lon],13);
    else if(navigator.geolocation)navigator.geolocation.getCurrentPosition(q=>map.setView([q.coords.latitude,q.coords.longitude],13),()=>{})},80);
}
$('#gear').onclick=()=>{$('#set').hidden?openSettings():($('#set').hidden=true)};
$('#sym').onclick=()=>{const d=$('#det'),o=d.hidden;if(!S.a)return;d.hidden=!o;$('#set').hidden=true;$('#sym').setAttribute('aria-expanded',o);$('#hh').textContent=o?'Tippen zum Einklappen':'Tippen für die Gründe';if(o)d.scrollIntoView({behavior:'smooth',block:'start'})};
$('#frm').onsubmit=async e=>{
  e.preventDefault();showErr('');
  if(!D||!D.a||!D.b){showErr('Setze Start und Ziel auf der Karte.');return}
  Object.assign(S,{a:D.a,b:D.b,vias:D.vias,tShow:$('#tShow').value,tHin:$('#tHin').value,tRue:$('#tRue').value,nf:$('#nf').checked});save();
  if(S.nf&&'Notification' in window&&Notification.permission==='default')try{await Notification.requestPermission()}catch(x){}
  $('#set').hidden=true;await refresh();
};
setInterval(async()=>{
  if(!S.nf||!S.a||!('Notification' in window)||Notification.permission!=='granted')return;
  const d=new Date(),now=`${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if(now===S.tShow&&S.notified!==todayStr()){S.notified=todayStr();save();const r=await refresh();
    if(r)new Notification('Heute: '+r.verdict.t,{body:r.verdict.s})}
},20000);
refresh();
</script>
